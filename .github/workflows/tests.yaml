---
name: tests

"on":
  push:
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@master
        with:
          dockerfile: Dockerfile
          verbose: true

      - name: Setup python
        uses: actions/setup-python@v4

      - name: Run pre-commit hooks
        run: |
          pip install pre-commit
          make check
